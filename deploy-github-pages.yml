# Copia questo file in  .github/workflows/deploy-pages.yml
# (i file dentro .github/workflows/ non possono essere creati da qui).
#
# Poi, sul repository GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# Ogni push su `main` pubblicherà l'app su GitHub Pages.
#
# Se preferisci pubblicare a mano: esegui `npm run build` e carica il
# contenuto della cartella `dist` sul tuo hosting statico.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_BASE44_APP_ID: 6ae0c1fbbb3001621317963f
          VITE_BASE44_BACKEND_URL: https://base44.app

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4